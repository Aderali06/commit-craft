[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-craft"
version = "0.1.0"
description = "Automated intelligent Git commit message generator adhering to the Conventional Commits specification."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Aderali06", email = "author@example.com" },
    { name = "Commit Craft Contributors" }
]
keywords = [
    "git",
    "commit",
    "conventional-commits",
    "cli",
    "automation",
    "developer-tools",
    "git-tools",
    "openai",
    "codex",
    "ai-commits"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities"
]
requires-python = ">=3.9"
dependencies = [
    "colorama>=0.4.6; platform_system == 'Windows'"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0"
]

[project.scripts]
commit-craft = "commit_craft.main:main"

[project.urls]
Homepage = "https://github.com/Aderali06/commit-craft"
Repository = "https://github.com/Aderali06/commit-craft"
Issues = "https://github.com/Aderali06/commit-craft/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["commit_craft*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
